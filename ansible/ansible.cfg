[defaults]
inventory = inventories/
roles_path = roles/
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
timeout = 60
gathering = smart
fact_caching = memory

[ssh_connection]
# Note: ProxyCommand/ProxyJump for bastion is set via ansible_ssh_common_args in inventory
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10
pipelining = True
retries = 3
