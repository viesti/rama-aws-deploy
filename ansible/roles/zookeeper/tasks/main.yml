---
# ZooKeeper installation and configuration

- name: Create ZooKeeper directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ rama_user }}"
    group: "{{ rama_user }}"
    mode: '0755'
  loop:
    - "{{ zookeeper_install_dir }}"
    - "{{ zookeeper_data_dir }}"
    - "{{ zookeeper_log_dir }}"
    - "{{ zookeeper_conf_dir }}"

- name: Download ZooKeeper archive
  ansible.builtin.get_url:
    url: "{{ zookeeper_url }}"
    dest: "/home/{{ rama_user }}/zookeeper.tar.gz"
    mode: '0644'

- name: Extract ZooKeeper archive
  ansible.builtin.unarchive:
    src: "/home/{{ rama_user }}/zookeeper.tar.gz"
    dest: "{{ zookeeper_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ zookeeper_install_dir }}/bin/zkServer.sh"

- name: Template ZooKeeper configuration (zoo.cfg)
  ansible.builtin.template:
    src: zoo.cfg.j2
    dest: "{{ zookeeper_conf_dir }}/zoo.cfg"
    owner: "{{ rama_user }}"
    group: "{{ rama_user }}"
    mode: '0644'
  notify: restart zookeeper

- name: Template ZooKeeper myid file
  ansible.builtin.template:
    src: myid.j2
    dest: "{{ zookeeper_data_dir }}/myid"
    owner: "{{ rama_user }}"
    group: "{{ rama_user }}"
    mode: '0644'
  notify: restart zookeeper

- name: Install ZooKeeper systemd service
  ansible.builtin.template:
    src: zookeeper.service.j2
    dest: /etc/systemd/system/zookeeper.service
    mode: '0644'
  become: true
  notify: restart zookeeper

- name: Enable and start ZooKeeper service
  ansible.builtin.systemd:
    name: zookeeper
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Wait for ZooKeeper to be ready
  ansible.builtin.command:
    cmd: "{{ zookeeper_install_dir }}/bin/zkServer.sh status"
  register: zk_status
  until: zk_status.rc == 0
  retries: 30
  delay: 2
  changed_when: false
